<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 100: '#ffedd5', 500: '#f97316', 600: '#ea580c' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans pb-20">

    <header class="p-4 bg-white shadow-sm sticky top-0 z-40">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-extrabold text-brand-600">SaborOfertas</h1>
            <div class="flex gap-4 items-center">
                <button onclick="toggleLocationModal()"
                    class="flex items-center gap-1 text-sm font-semibold text-slate-600">
                    <i data-lucide="map-pin" class="w-4 h-4"></i>
                    <span id="current-location-text">Morelia, Mich.</span>
                </button>
                <button onclick="triggerApiSync()">
                    <i id="sync-icon" data-lucide="refresh-cw" class="w-5 h-5 text-slate-600"></i>
                </button>
                <button onclick="toggleFavoritesDrawer()" class="relative">
                    <i data-lucide="heart" class="w-6 h-6 text-slate-600"></i>
                    <span id="fav-counter"
                        class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] px-1.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
        <div class="relative">
            <input type="text" id="search-input" placeholder="Buscar tacos, pizza, sushi..."
                class="w-full pl-10 pr-10 py-3 bg-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-brand-500 transition-all">
            <i data-lucide="search" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
            <button id="clear-search-btn" onclick="clearSearch()"
                class="hidden absolute right-3 top-3.5 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <span id="mobile-location-text" class="hidden">Morelia, Mich.</span>
    </header>

    <main class="p-4 max-w-5xl mx-auto space-y-8">
        <section>
            <h2 class="text-sm font-bold text-slate-500 mb-3 uppercase tracking-wider">Categorías</h2>
            <div id="category-chips" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide"></div>
        </section>

        <section class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
            <button class="filter-pill active px-3 py-1.5 rounded-full font-semibold bg-slate-900 text-white shadow-sm"
                data-type="all" onclick="setFilterType('all')">Todas</button>
            <button
                class="filter-pill px-3 py-1.5 rounded-full font-medium bg-white text-slate-700 border border-slate-200"
                data-type="2x1" onclick="setFilterType('2x1')">2x1</button>
            <button
                class="filter-pill px-3 py-1.5 rounded-full font-medium bg-white text-slate-700 border border-slate-200"
                data-type="30plus" onclick="setFilterType('30plus')">+30% Dto</button>
            <button
                class="filter-pill px-3 py-1.5 rounded-full font-medium bg-white text-slate-700 border border-slate-200"
                data-type="shipping" onclick="setFilterType('shipping')">Envío Gratis</button>
            <button
                class="filter-pill px-3 py-1.5 rounded-full font-medium bg-white text-slate-700 border border-slate-200"
                data-type="flash" onclick="setFilterType('flash')">Flash</button>
        </section>

        <section>
            <h2 class="text-sm font-bold mb-3 flex items-center gap-2 text-slate-800"><i data-lucide="zap"
                    class="w-4 h-4 text-yellow-500 fill-yellow-500"></i> Ofertas Flash Exclusivas</h2>
            <div id="flash-deals-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-900 p-4 rounded-2xl">
            </div>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-800">Ofertas Disponibles (<span id="deals-count-badge">0</span>)
                </h2>
                <select onchange="handleSortChange(this.value)"
                    class="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-sm font-medium outline-none">
                    <option value="recommended">Recomendados</option>
                    <option value="discount">Mayor descuento</option>
                    <option value="distance">Más cercanos</option>
                    <option value="rating">Mejor calificados</option>
                </select>
            </div>

            <div id="deals-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

            <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-slate-400">
                <i data-lucide="search-x" class="w-16 h-16 mb-4 opacity-50"></i>
                <p class="font-medium text-lg text-slate-500">No encontramos ofertas para tu búsqueda.</p>
                <button onclick="resetFilters()" class="text-brand-500 mt-3 font-bold hover:underline">Limpiar
                    filtros</button>
            </div>
        </section>
    </main>

    <div id="favorites-modal"
        class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 items-end sm:items-center justify-center">
        <div
            class="bg-white w-full sm:w-[400px] rounded-t-3xl sm:rounded-3xl p-6 h-[75vh] sm:h-[600px] flex flex-col shadow-2xl transition-transform">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-extrabold text-xl">Tus Favoritos</h3>
                <button onclick="toggleFavoritesDrawer()" class="p-2 bg-slate-100 rounded-full hover:bg-slate-200"><i
                        data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="favorites-list" class="flex-1 overflow-y-auto space-y-3 scrollbar-hide pb-4"></div>
        </div>
    </div>

    <div id="location-modal"
        class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl">
            <h3 class="font-extrabold text-lg mb-4 text-center">Selecciona tu ciudad</h3>
            <div class="space-y-2">
                <button onclick="selectCity('Morelia, Mich.')"
                    class="w-full text-center px-4 py-3 bg-slate-50 hover:bg-brand-50 hover:text-brand-600 font-semibold rounded-xl transition-colors border border-slate-100">Morelia,
                    Mich.</button>
                <button onclick="selectCity('CDMX')"
                    class="w-full text-center px-4 py-3 bg-slate-50 hover:bg-brand-50 hover:text-brand-600 font-semibold rounded-xl transition-colors border border-slate-100">Ciudad
                    de México</button>
            </div>
            <button onclick="toggleLocationModal()"
                class="w-full mt-4 bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800">Cerrar</button>
        </div>
    </div>

    <div id="coupon-modal"
        class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-5 shadow-2xl overflow-hidden">
            <div class="flex justify-between items-center mb-3">
                <span id="modal-badge"
                    class="bg-brand-500 text-white text-xs font-black px-2.5 py-1 rounded-lg uppercase tracking-wide"></span>
                <button onclick="closeCouponModal()" class="p-1.5 bg-slate-100 rounded-full hover:bg-slate-200"><i
                        data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <img id="modal-img" src="" class="w-full h-48 object-cover rounded-2xl mb-4 shadow-inner">
            <h2 id="modal-title" class="font-black text-2xl leading-tight text-slate-900"></h2>
            <div class="flex justify-between items-start mt-2">
                <div>
                    <p id="modal-restaurant" class="text-brand-600 font-bold text-sm flex items-center gap-1.5"></p>
                    <p id="modal-api-source" class="text-[10px] font-medium text-slate-400 mt-0.5"></p>
                </div>
            </div>

            <div class="flex gap-2 items-baseline mt-4 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                <span class="text-sm font-bold text-slate-500">Pagas:</span>
                <span id="modal-price-discount" class="text-3xl font-black text-brand-500"></span>
                <span id="modal-price-original" class="line-through text-slate-400 font-medium text-sm ml-1"></span>
            </div>

            <p id="modal-description" class="text-sm text-slate-600 mt-4 leading-relaxed"></p>
            <p id="modal-terms" class="text-[11px] text-slate-400 mt-2 font-medium"></p>

            <div class="bg-slate-900 p-4 rounded-2xl flex items-center justify-between mt-5 shadow-lg">
                <span id="modal-coupon-code" class="font-mono font-bold tracking-widest text-xl text-white"></span>
                <button onclick="copyCouponCode()"
                    class="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-2 rounded-xl flex gap-1.5 items-center transition-colors">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i> <span id="copy-btn-text">Copiar</span>
                </button>
            </div>

            <div id="modal-qr-container"
                class="flex justify-center mt-5 p-2 bg-white rounded-2xl mx-auto w-fit shadow-sm border border-slate-100">
            </div>

            <a id="modal-map-link" href="#" target="_blank"
                class="flex justify-center items-center gap-1.5 text-sm text-brand-600 hover:text-brand-700 font-bold mt-5 mb-2 bg-brand-50 py-2 rounded-xl">
                <i data-lucide="map" class="w-4 h-4"></i> <span id="modal-address"></span> <i
                    data-lucide="external-link" class="w-3 h-3"></i>
            </a>

            <button onclick="markAsRedeemed()"
                class="w-full bg-brand-500 hover:bg-brand-600 text-white font-black py-3.5 rounded-xl mt-2 transition-transform active:scale-95 shadow-lg shadow-brand-500/30">¡Marcar
                como Usado!</button>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
