<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - SaborOfertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white p-8 rounded-[2rem] shadow-xl max-w-sm w-full text-center space-y-4 border border-slate-100">

        <div
            class="w-24 h-24 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
            <i data-lucide="check-circle" class="w-12 h-12"></i>
        </div>

        <h1 class="text-3xl font-black text-slate-800 tracking-tight">¡Pago Exitoso!</h1>
        <p class="text-slate-500 text-sm font-medium">Pago realizado correctamente.</p>

        <div
            class="bg-slate-50 p-5 rounded-2xl text-left text-xs text-slate-600 mb-6 border border-slate-100 space-y-2 mt-6">
            <div class="flex justify-between border-b border-slate-200 pb-2">
                <span class="font-bold text-slate-400">Referencia de Orden:</span>
                <span class="font-black text-slate-700">DEMO-MP-001</span>
            </div>
            <div class="flex justify-between pt-1">
                <span class="font-bold text-slate-400">Método de pago:</span>
                <span class="font-black text-[#009EE3]">Mercado Pago Checkout</span>
            </div>
        </div>

        <a href="/"
            class="block w-full bg-slate-900 hover:bg-black text-white font-black py-3.5 rounded-xl transition-transform active:scale-95 shadow-md">
            Volver al inicio
        </a>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
